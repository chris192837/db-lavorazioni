databases:
  - name: db-lavorazioni-db
    plan: free

services:
  - type: web
    name: db-lavorazioni
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: db-lavorazioni-db
          property: connectionString
